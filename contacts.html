<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSD Tech — Контакты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo-wrapper"><span class="logo-text">SSD-Tech</span></div>
            <nav class="main-nav" id="navMenu">
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="history.html">История</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="performance.html">Тесты</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
            <div class="notifications">
                <span>🔔</span><span class="badge">3</span>
            </div>
            <div class="burger-btn" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </div>
    </header>

    <main class="content-container">
        <div class="content-block">
            <h2>Свяжитесь с нами</h2>
            <fieldset style="border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 20px;">
                <legend style="padding: 0 10px; font-weight: bold;">Ваше сообщение</legend>
                <form id="contactForm">
                    <div class="form-group">
                        <label>Ваше имя:</label>
                        <input type="text" id="userName" placeholder="Например: Иван Иванов" required>
                    </div>
                    <div class="form-group">
                        <label>Ваш Email:</label>
                        <input type="email" id="userEmail" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Ваш вопрос:</label>
                        <textarea rows="5" id="userMsg" placeholder="Напишите здесь ваш вопрос..." required></textarea>
                    </div>
                    <button type="submit" class="btn-green">Отправить сообщение</button>
                </form>
            </fieldset>
        </div>

        <div class="content-block">
            <h3>Наш главный офис</h3>
            <p><strong>Адрес:</strong> г. Москва, ул. Домодедова, д. 42</p>
            <p style="margin-bottom: 20px;"><strong>Телефон:</strong> +7 (903) 563-20-79</p>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2245.1!2d37.6!3d55.7!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNTXCsDQyJzAwLjAiTiAzN8KwMzYnMDAuMCJF!5e0!3m2!1sru!2sru!4v123456789" width="100%" height="250" style="border:0; border-radius: 8px;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </main>

    <footer class="main-footer">
        <p>© 2026 SSD-Tech</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
